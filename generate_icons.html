<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>產生 PWA 圖示</title>
  <style>
    body { font-family: -apple-system, "Microsoft JhengHei", sans-serif; padding: 24px; background: #f5f7fa; color: #1a202c; }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #555; margin-bottom: 16px; line-height: 1.6; }
    .preview { display: flex; gap: 20px; margin: 20px 0; align-items: flex-end; flex-wrap: wrap; }
    .preview > div { text-align: center; }
    .preview canvas { background: white; border: 1px solid #ccc; display: block; }
    .preview label { font-size: 12px; color: #666; display: block; margin-top: 6px; }
    button { padding: 10px 16px; background: #0f9d58; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; margin-right: 8px; }
    button:hover { background: #0a7c46; }
  </style>
</head>
<body>
  <h1>PWA 圖示生成器</h1>
  <p>
    這個工具用 Canvas 即時繪製 PNG 圖示。<br>
    多數 Android Chrome 已能直接使用 SVG 圖示安裝 PWA，<br>
    若安裝後桌面圖示異常（變空白或變預設圖示），再用這頁產生 PNG 替換即可。
  </p>

  <div class="preview">
    <div>
      <canvas id="c192" width="192" height="192"></canvas>
      <label>icon-192.png</label>
    </div>
    <div>
      <canvas id="c512" width="512" height="512" style="width: 256px; height: 256px;"></canvas>
      <label>icon-512.png (顯示縮小至 256px)</label>
    </div>
  </div>

  <button id="dl192">下載 icon-192.png</button>
  <button id="dl512">下載 icon-512.png</button>
  <p style="margin-top: 20px; font-size: 13px;">
    下載後將兩個檔案放到 <code>icons/</code> 資料夾即可。manifest.json 已預先設定好對應檔名。
  </p>

  <script>
    /**
     * 在 canvas 上繪製圖示（綠底圓角 + 白色 $）
     */
    function drawIcon(canvas) {
      const ctx = canvas.getContext('2d');
      const size = canvas.width;
      const radius = size * 0.1875; // 與 SVG 的 rx=96 對應

      // 圓角矩形背景
      ctx.fillStyle = '#0f9d58';
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();

      // $ 符號
      ctx.fillStyle = 'white';
      ctx.font = `900 ${size * 0.72}px "Arial Black", Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('$', size / 2, size / 2 + size * 0.04);
    }

    function download(canvas, name) {
      const link = document.createElement('a');
      link.download = name;
      link.href = canvas.toDataURL('image/png');
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    const c192 = document.getElementById('c192');
    const c512 = document.getElementById('c512');
    drawIcon(c192);
    drawIcon(c512);

    document.getElementById('dl192').addEventListener('click', () => download(c192, 'icon-192.png'));
    document.getElementById('dl512').addEventListener('click', () => download(c512, 'icon-512.png'));
  </script>
</body>
</html>
